<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Login | FanClub</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="admin-body"><div class="login-card"><a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">F</span><span>FANCLUB <small>NAVI MUMBAI</small></span></a><div class="eyebrow">STAFF ACCESS</div><h1>Welcome<br><span>back.</span></h1><p>Sign in to manage booking requests and contact messages.</p>
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
<form method="post"><label>Username<input name="username" required autocomplete="username" placeholder="Admin username"></label><label>Password<input type="password" name="password" required autocomplete="current-password" placeholder="Password"></label><button class="btn btn-dark btn-full" type="submit">Sign in ↗</button></form><a class="back-link" href="{{ url_for('home') }}">← Back to website</a></div></body></html>
